name: Publish website

on:
  push:
    branches: [main, desktop/mac-app]
    paths-ignore: ['desktop/**']
  pull_request:
    branches: [main]
    paths-ignore: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true
      - name: Test shared publishing checks
        run: ruby publishing/test_validator.rb
      - name: Prove invalid content cannot pass the build checks
        run: bundle exec ruby publishing/test_build.rb
      - name: Validate source, build, and compare published code
        env:
          JEKYLL_ENV: production
        run: bundle exec ruby publishing/validate_repository.rb --build --destination _site
      - name: Upload verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy verified website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
